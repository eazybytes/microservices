apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayserver-deployment
  namespace: eazybank
  labels:
    app: gatewayserver
    app.kubernetes.io/name: gatewayserver
    app.kubernetes.io/part-of: eazybank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatewayserver
  template:
    metadata:
      labels:
        app: gatewayserver
        app.kubernetes.io/name: gatewayserver
        app.kubernetes.io/part-of: eazybank
    spec:
      containers:
      - name: gatewayserver
        image: eazybytes/gatewayserver:s14
        imagePullPolicy: Always
        ports:
        - containerPort: 8072
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: REDIS_PORT
        - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: OTLP_TRACES_ENDPOINT
        - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: OTLP_LOGS_ENDPOINT
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
          valueFrom:
            configMapKeyRef:
              name: eazybank-configmap
              key: OTLP_METRICS_ENDPOINT
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 700Mi
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8072
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8072
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8072
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayserver
  namespace: eazybank
  labels:
    app: gatewayserver
    app.kubernetes.io/name: gatewayserver
    app.kubernetes.io/part-of: eazybank
spec:
  selector:
    app: gatewayserver
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8072
      targetPort: 8072
