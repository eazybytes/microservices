apiVersion: v1
kind: Secret
metadata:
  name: eazybank-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "eazybank.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  # Demo credentials only - replace with values injected by a secrets manager
  # (Sealed Secrets / External Secrets Operator / Vault) before any real deployment.
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.secrets.keycloakAdminUsername | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
